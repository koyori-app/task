# task-cli（apps/backend/crates/cli）の単体試験を Forgejo Actions で回す。
#
# GitHub 側（.github/workflows/cli-test.yml）と発火条件・試験対象は同じ。
# fmt / clippy / workspace 全体の試験は backend.yml が見る。ここは CLI だけを
# 変えたときに Postgres / Valkey を起こさず速く回す入口（GitHub 側と同じ役割）。
#
# GitHub 側との違い:
#   - runs-on: docker（backend.yml と同じ）
#   - cargo nextest ではなく cargo test -p task-cli。backend.yml と同じ理由で
#     追加のツール取得を増やさない
#
# PR #773（cli-test の paths を common / entity / payload へ広げる）は未 merge。
# merge されたら paths が再びずれる。追随は別 PR で起こす。

name: CLI

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/crates/cli/**'
      - 'rust-toolchain.toml'
      - '.forgejo/workflows/cli.yml'
  pull_request:
    paths:
      - 'apps/backend/crates/cli/**'
      - 'rust-toolchain.toml'
      - '.forgejo/workflows/cli.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    timeout-minutes: 30

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # runner のイメージは instance 任せなので、必要なものを自前で入れる。
      # mold は apps/backend/.cargo/config.toml がリンカに指定しており、無いと
      # リンクが必要なクレートで失敗する。
      - name: Install build tools
        run: |
          set -eux
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends mold curl ca-certificates

      # toolchain は rust-toolchain.toml に一本化する。
      - name: Install Rust
        run: |
          set -eux
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

      - name: Cache cargo
        uses: https://github.com/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: forgejo-cargo-cli-${{ runner.os }}-${{ hashFiles('apps/backend/Cargo.lock') }}
          restore-keys: |
            forgejo-cargo-cli-${{ runner.os }}-

      # GitHub 側は cargo nextest run -p task-cli。Forgejo では nextest を入れず
      # cargo test -p task-cli にする（backend.yml の註と同じ筋）。
      - name: Run tests
        run: cargo test -p task-cli
        working-directory: apps/backend

packages:
  - apps/frontend
  - packages/*
# 既定 (true) と同値だが明示で置く。既定は pnpm の版で動きうるし、
# この file は allowBuilds を一つひとつ書き出す流儀ゆえ、意図は行で示す。
sharedWorkspaceLockfile: true
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
catalog:
  '@codemirror/commands': 6.11.0
  '@codemirror/lang-markdown': 6.5.2
  '@codemirror/language': 6.12.4
  '@codemirror/state': 6.7.2
  '@codemirror/view': 6.43.10
  '@lezer/highlight': 1.2.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.2.5
minimumReleaseAgeExclude:
  - '@koyori-app/openapi-vue-query'
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
saveExact: true
catalogMode: prefer

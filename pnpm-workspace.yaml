packages:
  - apps/frontend
  - packages/*
# 既定 (true) と同値だが明示で置く。既定は pnpm の版で動きうるし、
# この file は allowBuilds を一つひとつ書き出す流儀ゆえ、意図は行で示す。
engineStrict: true
sharedWorkspaceLockfile: true
allowBuilds:
  '@nestjs/core': true
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
catalog:
  '@koyori-app/arc': 0.1.0-alpha.9
  '@koyori-app/arc-vue': 0.1.0-alpha.9
  '@koyori-app/ui-vue': 0.13.0
  '@lezer/highlight': 1.2.5
  remark-breaks: 4.0.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
minimumReleaseAgeExclude:
  - '@koyori-app/openapi-vue-query'
  - '@koyori-app/ui-vue'
  - '@koyori-app/arc@0.1.0-alpha.9'
  - '@koyori-app/arc-vue@0.1.0-alpha.9'
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
saveExact: true
catalogMode: prefer

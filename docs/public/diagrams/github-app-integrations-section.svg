<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" role="img" aria-label="プロジェクト設定の連携セクションの画面">
  <style>
    :root { --bg: #ffffff; --panel: #f4f4f5; --line: #d4d4d8; --text: #18181b; --muted: #71717a; --accent: #2563eb; --ok: #15803d; --warn: #b45309; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --panel: #27272a; --line: #3f3f46; --text: #f4f4f5; --muted: #a1a1aa; --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; }
    }
    text { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 14px; fill: var(--text); }
    .muted { fill: var(--muted); font-size: 13px; }
    .head { font-weight: 600; }
    .link { fill: var(--accent); }
    .ok { fill: var(--ok); font-size: 13px; }
    .warn { fill: var(--warn); font-size: 13px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .frame { fill: var(--bg); stroke: var(--line); }
    .ctl { fill: var(--panel); stroke: var(--line); }
    .rule { stroke: var(--line); }
  </style>
  <rect class="frame" x="1" y="1" width="558" height="128" rx="8"/>
  <text class="head" x="20" y="30">連携</text>
  <line class="rule" x1="1" y1="44" x2="559" y2="44"/>
  <text class="head" x="20" y="72">GitHub</text>
  <text class="muted" x="20" y="96"><tspan class="mono">myorg/myapp</tspan> を連携中（2026年7月1日 から）</text>
  <rect class="ctl" x="326" y="72" width="122" height="30" rx="6"/>
  <text x="344" y="92">Issue を取り込む</text>
  <rect class="ctl" x="456" y="72" width="88" height="30" rx="6"/>
  <text x="468" y="92">連携を解除</text>
</svg>

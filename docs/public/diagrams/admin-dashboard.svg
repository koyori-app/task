<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="管理者ダッシュボードの配置">
  <style>
    :root { --bg:#ffffff; --panel:#f4f4f5; --line:#a1a1aa; --text:#27272a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#18181b; --panel:#27272a; --line:#71717a; --text:#f4f4f5; } }
    text { fill:var(--text); font:13px system-ui, sans-serif; }
    .box { fill:var(--panel); stroke:var(--line); }
    .h { font-weight:600; }
  </style>
  <rect x="1" y="1" width="558" height="168" rx="6" fill="var(--bg)" stroke="var(--line)"/>
  <text x="16" y="28" class="h">管理者ダッシュボード</text>
  <line x1="1" y1="44" x2="559" y2="44" stroke="var(--line)"/>
  <text x="16" y="74">ユーザー数: 1,234     テナント数: 87     停止中: 3</text>
  <line x1="1" y1="92" x2="559" y2="92" stroke="var(--line)"/>
  <rect class="box" x="16" y="112" width="120" height="30" rx="4"/>
  <text x="28" y="132">ユーザー管理</text>
  <rect class="box" x="146" y="112" width="120" height="30" rx="4"/>
  <text x="158" y="132">テナント管理</text>
  <rect class="box" x="276" y="112" width="100" height="30" rx="4"/>
  <text x="288" y="132">監査ログ</text>
  <rect class="box" x="386" y="112" width="70" height="30" rx="4"/>
  <text x="398" y="132">設定</text>
</svg>

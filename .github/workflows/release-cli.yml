name: Release CLI

# v* のタグを push したときに CLI（task）のバイナリを GitHub Release へ添付する。
# トリガーと concurrency は publish-images.yml に合わせる。
#
# pull_request でも同じ matrix を組み立てるが、そちらは公開しない。リリース経路を
# タグ push で初めて試すと、壊れていたときにリリースそのものが作れない。
# リリースの本文は git-cliff（cliff.toml）が作る（notes ジョブ）。
on:
  push:
    tags:
      - 'v*'
  pull_request:
    # CLI のビルドに入るものを列挙する。CLI 自身だけを見ていると、共有クレートへ
    # Windows で通らない依存が入ったときに気づけず、次のタグ push で初めて落ちる。
    # CLI が読むクレートを増やしたらここにも足すこと
    paths:
      - 'apps/backend/crates/cli/**'
      - 'apps/backend/crates/entity/**'
      - 'apps/backend/crates/common/**'
      - 'apps/backend/crates/payload/**'
      - 'apps/backend/Cargo.toml'
      - 'apps/backend/Cargo.lock'
      - 'apps/backend/.cargo/**'
      - '.github/workflows/release-cli.yml'
      - 'rust-toolchain.toml'
      # リリースの本文（notes ジョブ）
      - 'cliff.toml'
      - 'CHANGELOG.md'
      - 'scripts/changelog.sh'
      - 'scripts/changelog_pr_map.py'
      - 'scripts/changelog_pr_map_test.py'
      - 'scripts/changelog-fixtures/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # リリースのビルドは途中で打ち切らない
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      # 1 つ落ちても残りの失敗をまとめて見たい。release ジョブは needs で止まるので、
      # 壊れた配布物が公開されることはない
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          # alpine など glibc の無い CI コンテナでもそのまま置けるように静的リンクする
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # toolchain は rust-toolchain.toml に一本化する（components もそこで指定済み）。
      # 引数なしの install が「アクティブな toolchain」= rust-toolchain.toml を読む。
      - name: Install Rust
        run: rustup toolchain install

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      # .cargo/config.toml が gnu の Linux ビルドで mold リンカを要求する
      - name: Install mold
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y mold

      # ring の C コードを musl 向けにビルドするために要る
      - name: Install the musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/backend -> target
          key: ${{ matrix.target }}
          # このワークフローは main では走らないので main の分を作れず、PR で保存しても
          # 同じ PR の再 push でしか読めない。target ごとに 340 MB を PR 単位で溜めると
          # 10 GB の上限で他ジョブの main の分を追い出すため保存しない
          save-if: false

      # タグの版をそのままバイナリへ入れる。タグ以外のビルドはクレートの版のまま
      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          release_version=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ -z "$version" ] || [ "$version" = "${GITHUB_REF_NAME}" ]; then
              echo "::error::タグ ${GITHUB_REF_NAME} から版を取り出せません（v<version> の形にしてください）"
              exit 1
            fi
            release_version="$version"
          else
            version=$(awk -F'"' '/^\[package\]/ { in_package = 1 }
                                 in_package && /^version = / { print $2; exit }' \
                      apps/backend/crates/cli/Cargo.toml)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "release_value=$release_version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      - name: Build
        shell: bash
        env:
          TASK_CLI_VERSION: ${{ steps.version.outputs.release_value }}
        run: cargo build --release --locked -p task-cli --bin task --target ${{ matrix.target }}
        working-directory: apps/backend

      # 受け入れ条件をビルドしたその場で確かめる。タグでは版がタグと一致すること
      - name: Smoke-test the binary
        shell: bash
        run: |
          set -euo pipefail
          binary="apps/backend/target/${{ matrix.target }}/release/task"
          [ "${{ matrix.archive }}" = "zip" ] && binary="${binary}.exe"

          reported=$("$binary" --version)
          echo "$reported"
          [ "$reported" = "task ${{ steps.version.outputs.value }}" ] || {
            echo "::error::--version が ${{ steps.version.outputs.value }} と一致しません: $reported"
            exit 1
          }
          "$binary" review summary --help > /dev/null

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="task-${{ steps.version.outputs.value }}-${{ matrix.target }}"
          staging="apps/backend/target/${{ matrix.target }}/release"
          mkdir -p dist

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$staging" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${name}.zip" task.exe > /dev/null)
            asset="${name}.zip"
          else
            tar -czf "dist/${name}.tar.gz" -C "$staging" task
            asset="${name}.tar.gz"
          fi

          # 置くだけで使う配布物なので、取り違えを確かめられるようにする。
          # sha256sum は Linux と Git for Windows、shasum は macOS にある
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$asset" > "${asset}.sha256")
          else
            (cd dist && shasum -a 256 "$asset" > "${asset}.sha256")
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # リリースの本文を git-cliff で作る。PR でも未リリースの分で作れることと、
  # scripts/changelog.sh check（cliff.toml の固定の検査と CHANGELOG.md のずれ）を確かめる
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # スタック PR の下の PR を拾うためにマージ済みの PR の一覧を読む
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全てのタグと履歴が要る
          fetch-depth: 0
          persist-credentials: false

      # checkout が注釈付きタグをコミットへの参照に置き換えることがあり、そのままだと
      # タグのメッセージが本文から落ちる。リポジトリは PUBLIC なので認証なしで取り直せる
      - name: Fetch the annotated tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          fi

      # 版は scripts/changelog.sh の GIT_CLIFF_VERSION と揃える
      - name: Install git-cliff
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: git-cliff@2.14.2

      # 検査は GitHub の上の今の PR の題・本文を読むので、マージ済みの PR を後から直すと落ちる。
      # タグの push で落とすとリリースと無関係な理由で公開が止まるので、PR と手動実行だけで回す
      - name: Check the changelog
        if: github.event_name != 'push' || github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/changelog.sh check

      # タグの push はその版の節を、それ以外は未リリースの分を作る（v0.0.0 は存在しないタグ）
      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/changelog.sh notes "$GITHUB_REF_NAME" > release-notes.md
          else
            scripts/changelog.sh notes v0.0.0 > release-notes.md
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          grep -q '^## \[' release-notes.md || { echo "::error::リリースの本文に版の見出しがありません"; exit 1; }

      # 名前を release ジョブの pattern: task-* に当てない（配布物に混ぜない）
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    # 全ての target がビルドできたときだけ公開する（壊れた配布物を出さない）。
    # 版を名乗るのはタグの push だけ（Derive the version from the tag）なので、
    # タグを指定した手動実行のビルド（版 0.1.0）は公開しない
    needs: [build, notes]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      # cosign の keyless 署名が OIDC トークンを使う。build には要らないので
      # release ジョブだけに絞る
      id-token: write

    steps:
      - name: Download every build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: task-*
          merge-multiple: true
          path: dist

      # dist/* は添付と SHA256SUMS の対象なので、本文は別の場所に落とす
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # 配布物ぜんぶの hash を SHA256SUMS 一枚に束ね、その一枚へ keyless 署名する。
      # 各 .sha256 はこれまでどおり残す（一つだけ落として検める人向け）。
      # 署名対象を一枚にするのは、archive ごとに署名を増やすと検める側の手数が
      # 配布物の数だけ増えるため
      - name: Create and sign SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum task-*.tar.gz task-*.zip > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob SHA256SUMS \
            --yes \
            --bundle SHA256SUMS.cosign.bundle

      # 署名したその場で検める（壊れた署名を Release へ添えない）。
      # 身元は「この repo のこの workflow が、タグから走った」ことまで縛る
      - name: Verify the signature before publishing
        run: |
          set -euo pipefail
          cd dist
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/koyori-app/task/\.github/workflows/release-cli\.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # SHA256SUMS と SHA256SUMS.cosign.bundle も dist に居るので dist/* に含まれる
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist

          # 同じタグで作り直したときも添付をやり直せるようにする。既にあるリリースの
          # 本文は書き換えない（手で直した本文を上書きしない）
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes/release-notes.md
          fi

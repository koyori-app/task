name: CLI Unit Test

# CLI は apps/backend の Cargo ワークスペースのメンバーなので、fmt / clippy / 型検査は
# backend-fmt / backend-clippy / backend-test（いずれも --workspace）が見る。
# ここは CLI だけを変えたときに、Postgres も Redis も起こさず速く回すための入口。
# backend-test も同じ paths で走るが、あちらは DB 込みで重い。

on:
  pull_request:
    paths:
      - 'apps/backend/crates/cli/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/cli-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/crates/cli/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/cli-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # toolchain は rust-toolchain.toml に一本化する（components もそこで指定済み）。
      # 引数なしの install が「アクティブな toolchain」= rust-toolchain.toml を読む。
      - name: Install Rust
        run: rustup toolchain install

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/backend -> target
          cache-on-failure: true
          # キャッシュは main だけが書く。PR ごとに保存すると 10 GB の上限で main の分が追い出され、
          # 全ジョブがコールドビルドになる（PR は main の分を読む）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run -p task-cli
        working-directory: apps/backend

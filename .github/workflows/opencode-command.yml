name: opencode-command

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (
        github.event_name == 'pull_request_review_comment' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request
        )
      ) &&
      (
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/opencode') ||
        contains(github.event.comment.body, ' /opencode')
      ) &&
      contains(fromJson('["yupix", "sousuke0422"]'), github.event.comment.user.login) &&
      (
        github.event_name != 'pull_request_review_comment' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write

    steps:
      # issue_comment には head リポジトリが無いので API で取る。fork の head は秘密と書き込み権限のもとで扱わない
      - name: Check PR origin
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify fork PR
        if: steps.origin.outputs.same_repo == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "fork からの PR では /oc は動きません。"

      - name: Checkout repository
        if: steps.origin.outputs.same_repo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run opencode
        if: steps.origin.outputs.same_repo == 'true'
        uses: anomalyco/opencode/github@68bc26b7da1990ce10ffecfbc1e09eb13aa5d824 # v2.1.4
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          use_github_token: true
          model: opencode-go/mimo-v2.5-pro
          prompt: |
            日本語で回答してください。
            特段の指定がない限りレビュー時にコードの修正は行わないでください。

            以下の行為は禁止です。
            - コード修正
            - ファイル作成
            - ファイル削除
            - コミット
            - push
            - ブランチ作成
            - Pull Request作成

            【重複指摘の禁止】
            レビューを開始する前に、このPRに既に投稿されている自分（opencode）のレビューコメントを必ず確認してください。
            過去のレビューで既に指摘した内容は繰り返さないでください。
            新しいコミットで追加・変更された差分に絞ってレビューし、既に修正済みまたは指摘済みの問題は対象外としてください。
            指摘することが何もない場合は「前回のレビューから新たな問題は見つかりませんでした」と一言だけ返してください。

            【確認してから指摘する】
            指摘する前に必ず実際のコードを読んで問題が存在することを確認してください。
            推測や「〜の可能性があります」という曖昧な指摘はしないでください。
            コードを確認した結果、問題がなければその項目は指摘しないでください。

            【優先度の扱い】
            High・Medium の指摘のみ詳しく説明してください。
            Low の指摘は最後に箇条書きでまとめるだけにしてください。詳細説明は不要です。

            バックエンドは以下のスタックです。
            - Rust
            - Axum
            - SeaORM - PostgreSQL
            - Apalis - Redis
            フロントエンドは以下のスタックです。
            - Vue.js
            - Vike
            - Tailwind CSS
            - Pinia
            - Tanstack Query, Table, Form
            - Shadcn Vue
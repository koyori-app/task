name: Emoji font on macOS

# 絵文字の字の切り替えが macOS の browser で効くかを、画素の比べで確かめる（TASK-410）。
# 本物の Safari（safaridriver）と、Playwright の Chromium、Firefox、WebKit を撃つ。
# 撮る script は apps/frontend/scripts/emoji-font-macos/run.mjs。像と判じは artifact に上げる。
on:
  push:
    branches:
      - fix/emoji-font-safari

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Install the tools for the check
        working-directory: apps/frontend/scripts/emoji-font-macos
        run: |
          echo '{"type":"module","private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts playwright@1.63.0 selenium-webdriver@4.39.0 pngjs@7.0.0 pixelmatch@7.1.0
          npx playwright install chromium firefox webkit

      - name: Shoot and compare
        working-directory: apps/frontend/scripts/emoji-font-macos
        run: node run.mjs ../.. "$RUNNER_TEMP/emoji-font"

      - name: Write the summary
        if: always()
        run: cat "$RUNNER_TEMP/emoji-font/results.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emoji-font-macos
          path: ${{ runner.temp }}/emoji-font
          retention-days: 14

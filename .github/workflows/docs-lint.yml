name: docs-lint

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-lint.yml"

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: docs/STYLE.md の規則を検査する
        run: node docs/scripts/lint-style.mjs
      - name: 検査スクリプト自体のテスト
        run: node --test docs/scripts/lint-style.test.mjs

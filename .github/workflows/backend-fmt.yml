name: Backend Format Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-fmt.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-fmt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # toolchain は rust-toolchain.toml に一本化する（components もそこで指定済み）。
      # 引数なしの install が「アクティブな toolchain」= rust-toolchain.toml を読む。
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/backend -> target
          # キャッシュは main だけが書く。PR ごとに保存すると 10 GB の上限で main の分が追い出され、
          # 全ジョブがコールドビルドになる（PR は main の分を読む）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: apps/backend

      # workspace-hack（cargo-hakari の生成物）が依存変更に追従しているか検査する。
      # ずれていたら `cargo hakari generate` / `cargo hakari manage-deps` を実行してコミットする。
      - name: Install cargo-hakari
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hakari@0.9.39

      - name: Check workspace-hack is up to date
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run
        working-directory: apps/backend

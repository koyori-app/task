name: Backend Format Check

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-fmt.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/backend-fmt.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # toolchain は rust-toolchain.toml に一本化する（components もそこで指定済み）。
      # 引数なしの install が「アクティブな toolchain」= rust-toolchain.toml を読む。
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/backend -> target
          # キャッシュは main だけが書く。PR ごとに保存すると 10 GB の上限で main の分が追い出され、
          # 全ジョブがコールドビルドになる（PR は main の分を読む）
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: apps/backend

      # workspace-hack（cargo-hakari の生成物）が依存変更に追従しているか検査する。
      # ずれていたら `cargo hakari generate` / `cargo hakari manage-deps` を実行してコミットする。
      - name: Install cargo-hakari
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-hakari@0.9.39

      - name: Check workspace-hack is up to date
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run
        working-directory: apps/backend
